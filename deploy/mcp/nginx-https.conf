# Installed with the separate HTTP ACME challenge server.
limit_req_zone $binary_remote_addr zone=locket_mcp:10m rate=120r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name memory.example.com;
    ssl_certificate /etc/letsencrypt/live/locket-mcp-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locket-mcp-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    location = / {
        default_type application/json;
        return 200 '{"service":"Locket Memory MCP","endpoint":"https://memory.example.com/mcp","transport":"streamable-http","authentication":"Bearer token required; contact the administrator for an individual account"}';
    }

    location = /mcp {
        limit_req zone=locket_mcp burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8724;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location / { return 404; }
}
